# Przykład: nginx + TLS + statyczny Vite (dist/) + proxy do Payload (Next na 127.0.0.1:3000)
# Skopiuj do sites-available, podmień domenę, ścieżki certów i root na dist/.

upstream payload_cms {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name twojadomena.pl www.twojadomena.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twojadomena.pl www.twojadomena.pl;

    ssl_certificate     /etc/letsencrypt/live/twojadomena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twojadomena.pl/privkey.pem;

    # Katalog buildu frontu (npm run build w korzeniu repo)
    root /var/www/product-shapers/dist;
    index index.html;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://payload_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Panel Payload + zasoby Next pod /admin
    location ^~ /admin {
        proxy_pass http://payload_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location ^~ /media/ {
        proxy_pass http://payload_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # React Router — SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
