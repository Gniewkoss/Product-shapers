# Netlify: Vite React (marketing). CMS na Renderze — CMS_ORIGIN w panelu; patrz DEPLOY-NETLIFY.md (opcjonalnie drugi projekt Netlify + cms/netlify.toml).
[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin"
  to = "https://product-shapers-cms.onrender.com/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://product-shapers-cms.onrender.com/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
