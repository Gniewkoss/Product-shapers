# Witryna Netlify A: Vite React (marketing). CMS — osobny projekt Netlify z base cms/ — patrz DEPLOY-NETLIFY.md
[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
