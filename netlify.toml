# Netlify: Vite React (marketing). CMS na Renderze — CMS_ORIGIN w panelu; patrz DEPLOY-NETLIFY.md (opcjonalnie drugi projekt Netlify + cms/netlify.toml).
[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin"
  to = "https://product-shapers-cms.onrender.com/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://product-shapers-cms.onrender.com/admin/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA proxy na CMS ma domyślnie trafiać do klienta z no-store — inaczej edge mógłby utrwalać GET /api/* dla gości.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    Vary = "Accept-Encoding"
