# Render Blueprint: Postgres + Payload CMS z podkatalogu cms/
# Domyślny stack z DEPLOY-NETLIFY.md: frontend Netlify + CMS ten serwis — ustaw PAYLOAD_PUBLIC_SERVER_URL / FRONTEND_ORIGINS na URL Netlify.
#
# Uwagi:
# - Po utworzeniu z blueprintu Render poprosi o wartości zmiennych sync:false (URL Twojej strony Netlify).
# - Pliki uploadów domyślnie są na dysku ephemeral — przy większej liczbie mediów dodaj Persistent Disk
#   na mount np. …/cms/media (ścieżka robocza serwisu = rootDir cms).
# - Jeśli plan `free` dla Postgres nie jest dostępny w regionie, zmień na np. basic-256mb.

databases:
  - name: payload-postgres
    region: frankfurt
    plan: free
    databaseName: payload

services:
  - type: web
    name: product-shapers-cms
    runtime: node
    region: frankfurt
    plan: free
    rootDir: cms
    # Build bez żywego Postgresa (jak cms/Dockerfile). Musi być sh -c — inaczej Render nie parsuje && i npm ci dostaje śmieciowe argumenty (npm help ci).
    buildCommand: sh -c 'npm ci && DATABASE_ADAPTER=sqlite DATABASE_URI=file:/tmp/render-build.sqlite PAYLOAD_SECRET=render-build-placeholder-minimum-32-characters-xx PAYLOAD_DATABASE_PUSH=false npm run build'
    startCommand: npm start
    healthCheckPath: /api/content-version
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --no-deprecation
      - key: DATABASE_URI
        fromDatabase:
          name: payload-postgres
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: PAYLOAD_PUBLIC_SERVER_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PAYLOAD_DATABASE_PUSH
        value: "true"
