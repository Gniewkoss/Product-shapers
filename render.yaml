# Render Blueprint: Postgres + Payload CMS z podkatalogu cms/
# Domyślny stack z DEPLOY-NETLIFY.md: frontend Netlify + CMS ten serwis — ustaw PAYLOAD_PUBLIC_SERVER_URL / FRONTEND_ORIGINS na URL Netlify.
#
# Uwagi:
# - Po utworzeniu z blueprintu Render poprosi o wartości zmiennych sync:false (URL Twojej strony Netlify).
# - Free plan nie ma Persistent Disk — kontener Rendera jest ephemeral i uploady giną przy redeployu.
#   Dla trwałości mediów użyj S3-compatible storage (Cloudflare R2 zalecane, free do 10 GB, zero egress):
#   ustaw w Environment serwisu S3_BUCKET + S3_ACCESS_KEY_ID + S3_SECRET_ACCESS_KEY + S3_ENDPOINT
#   + S3_REGION=auto (patrz cms/.env.production.example). Plugin s3Storage włącza się automatycznie.
#   Alternatywa: upgrade planu web na `starter` + dodać sekcję `disk` (min. 1 GB, $0.25/mo).
# - Jeśli plan `free` dla Postgres nie jest dostępny w regionie, zmień na np. basic-256mb.

databases:
  - name: payload-postgres
    region: frankfurt
    plan: free
    databaseName: payload

services:
  - type: web
    name: product-shapers-cms
    runtime: node
    region: frankfurt
    plan: free
    rootDir: cms
    # Build bez żywego Postgresa (jak cms/Dockerfile). Musi być sh -c — inaczej Render nie parsuje && i npm ci dostaje śmieciowe argumenty (npm help ci).
    # `--include=dev` bo NODE_ENV=production wymusza skip devDeps, a Next 16 wymaga typescript + @types/react
    # w build worker (TypeScript type check faza po webpack compile). Runtime nadal NODE_ENV=production.
    buildCommand: sh -c 'npm ci --include=dev && DATABASE_ADAPTER=sqlite DATABASE_URI=file:/tmp/render-build.sqlite PAYLOAD_SECRET=render-build-placeholder-minimum-32-characters-xx PAYLOAD_DATABASE_PUSH=false npm run build'
    # `payload migrate` przed `next start` — idempotentne (sprawdza tabelę payload_migrations),
    # gwarantuje że schema prod-Postgresa nadąża za commitami w cms/src/migrations/.
    # Render free nie ma preDeployCommand, więc migracja jest częścią startCommand.
    # sh -c bo Render nie parsuje && bezpośrednio (jak w buildCommand).
    startCommand: sh -c 'npm run migrate && npm start'
    healthCheckPath: /api/content-version
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --no-deprecation
      - key: DATABASE_URI
        fromDatabase:
          name: payload-postgres
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: PAYLOAD_PUBLIC_SERVER_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      # Drizzle "push" w środowisku bez TTY potrafi cicho ominąć zmiany schematu
      # (np. ADD COLUMN dla nowych pól w globals → 500/404 w adminie). Po pierwszym
      # bootstrapie (DEPLOY-NETLIFY.md) trzymamy false i jedziemy migracjami.
      - key: PAYLOAD_DATABASE_PUSH
        value: "false"
      # Netlify Build Hook — po zapisie treści CMS triggeruje rebuild frontendu.
      # Pobierz URL z panelu Netlify: Site settings → Build & deploy → Build hooks → Add build hook.
      # Bez tej zmiennej CMS działa normalnie, ale frontend nie przebudowuje się automatycznie.
      - key: NETLIFY_BUILD_HOOK_URL
        sync: false
